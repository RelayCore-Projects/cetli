name: cetli
description: "Cetli – a simple offline shopping list with file-based sharing."
publish_to: 'none'

# MAJOR.MINOR.PATCH+build – the released APK version is set by CI from the git tag
version: 0.3.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.0
  sqflite: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    # FR-10: the built-in catalog, generated by tool/build_catalog.py
    - assets/catalog/builtin_items.txt
