name: CI

# On every push: analysis + tests and the signed APK build run IN PARALLEL,
# then – only if both succeed – publishing:
#  - push to a branch → "Preview" pre-release (always the latest build)
#  - push of a v* tag → final GitHub Release with the matching CHANGELOG section
# Pull requests run analysis + tests (required status check for main).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'

# The runner image is pinned (ubuntu-24.04): the Android NDK version in
# android/app/build.gradle.kts must be pre-installed on it (ADR-005).

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The storage tests (sqflite_common_ffi) need SQLite on the runner
      - run: sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      # The resolved pubspec.lock is attached to the Preview release, so it can be
      # committed back (pub.dev is not reachable from the development machine)
      - uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
          retention-days: 7
      # Errors and warnings fail the build; style hints (info) are only reported
      - run: flutter analyze --no-fatal-infos
      - run: mkdir -p build && flutter test --file-reporter json:build/test-results.json
      # Failed test names and messages as annotations (readable without signing in)
      - name: Annotate failed tests
        if: failure()
        run: |
          if [ -f build/test-results.json ]; then python3 tool/ci_test_annotations.py build/test-results.json; fi

  apk:
    name: Build APK
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_display: ${{ steps.version.outputs.display }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Determine version
        id: version
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BASE=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            if [ "$NAME" != "$BASE" ]; then
              echo "::error::The tag ($GITHUB_REF_NAME) and the pubspec.yaml version ($BASE) differ"
              exit 1
            fi
            DISPLAY="$NAME"
          else
            NAME="${BASE}-dev.${BUILD_NUMBER}"
            DISPLAY="$NAME ($SHORT_SHA, ${GITHUB_REF_NAME})"
          fi
          {
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "VERSION_NAME=$NAME"
            echo "VERSION_DISPLAY=$DISPLAY"
          } >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "display=$DISPLAY" >> "$GITHUB_OUTPUT"
          echo "Version: $DISPLAY (build $BUILD_NUMBER)"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CETLI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The CETLI_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cetli-release.p12"
          echo "CETLI_KEYSTORE_PATH=$RUNNER_TEMP/cetli-release.p12" >> "$GITHUB_ENV"

      # 64-bit ARM only (every current phone) – faster build, about a third of the APK size
      - name: Build APK
        env:
          CETLI_KEYSTORE_PASSWORD: ${{ secrets.CETLI_KEYSTORE_PASSWORD }}
          CETLI_KEY_ALIAS: ${{ secrets.CETLI_KEY_ALIAS }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER" \
            --dart-define=APP_VERSION="$VERSION_DISPLAY"
          mv build/app/outputs/flutter-apk/app-release.apk "cetli-${VERSION_NAME}.apk"
          rm -f "$CETLI_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: cetli-*.apk
          retention-days: 30

  publish:
    name: Publish
    needs: [test, apk]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_NAME: ${{ needs.apk.outputs.version_name }}
      VERSION_DISPLAY: ${{ needs.apk.outputs.version_display }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - uses: actions/download-artifact@v4
        with:
          name: pubspec-lock
          path: lock

      - name: Update Preview release
        if: github.ref_type == 'branch'
        run: |
          gh release delete preview --yes --cleanup-tag 2>/dev/null || true
          gh release create preview cetli-*.apk lock/pubspec.lock \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Preview – ${VERSION_DISPLAY}" \
            --notes "Development preview built from the latest commit of \`${GITHUB_REF_NAME}\` (${GITHUB_SHA:0:7}). Not a stable release – for testing only."

      - name: Final release
        if: github.ref_type == 'tag'
        run: |
          # The CHANGELOG section of this version, without Obsidian links
          awk -v v="$VERSION_NAME" '
            index($0, "## [" v "]") == 1 {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' docs/CHANGELOG.md \
            | sed -E 's/\[\[[^]|]*\|([^]]*)\]\]/\1/g; s/\[\[([^]|#]*)[^]]*\]\]/\1/g' > notes.md
          [ -s notes.md ] || echo "See docs/CHANGELOG.md" > notes.md
          gh release create "$GITHUB_REF_NAME" cetli-*.apk \
            --title "Cetli ${VERSION_NAME}" \
            --notes-file notes.md \
            --verify-tag
